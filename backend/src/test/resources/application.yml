spring:
  application:
    name: Buurekrom

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO

server:
  servlet:
    session:
      cookie:
        name: BPSESSION
        http-only: true
        same-site: lax
      timeout: 12h
